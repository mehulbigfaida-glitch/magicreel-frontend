name: Frontend build validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/muse-legal-safety-foundation"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
